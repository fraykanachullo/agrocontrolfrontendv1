name: agrocontrol
description: "AgroControl - Gestión Agrícola Inteligente"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.3

  # Storage
  flutter_secure_storage: ^9.2.4
  sqflite: ^2.4.2
  path: ^1.9.1

  # State Management
  flutter_riverpod: ^2.6.1

  # Dependency Injection
  get_it: ^8.0.3

  # Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  share_plus: ^11.0.0

  # Camera & Images
  image_picker: ^1.1.2
  path_provider: ^2.1.5

  # Ubicación del terreno (GPS) y abrirla en el mapa
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.14
  json_serializable: ^6.9.4
  freezed: ^2.5.8

flutter:
  uses-material-design: true

  # Fuentes dentro de la app (google_fonts las busca aquí primero): así se
  # ven igual sin internet en el campo.
  assets:
    - assets/google_fonts/
